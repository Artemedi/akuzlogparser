# Настройка AKUZ Log Explorer v4.5.0. Файл остаётся ТОЛЬКО на вашем компьютере.
# Не отправляйте заполненный конфиг и не добавляйте его в Git.

[ssh]
host = 192.0.2.10
port = 22
username = akuz_reader
# Пароль SSH. Оставьте пустым при использовании SSH-ключа/агента.
password =
# Пароль sudo. Если пустой — используется password из строки выше.
# Если оба пароля пусты, используется sudo -n (NOPASSWD).
sudo_password =
# При необходимости: C:\Users\you\.ssh\id_ed25519
key_file =

[logs]
remote_log_dir = /srv/akuz/logs
# Маска имён журналов АКУЗ. Обрабатываются только обычные .log.
file_pattern = *.log
# Пустое значение = папка downloads рядом с EXE или исходниками
local_dest =
# Совместимость старого CLI. В интерфейсе дата берётся из YYYYMMDD_*.log или задаётся вручную:
base_date =

# Дополнительный файловый источник: журналы Windows AKUZ.Service.
# Explorer должен работать НА Windows с доступом к сетевой папке по SMB.
# Используется текущая учётная запись Windows (или заранее подключённые сетевые credentials).
# Пример: log_dir = \\SERVER\AKUZLogs
# Лучше предоставить read-only share, а не C$.
[windows]
enabled = false
log_dir = \\SERVER\AKUZLogs
file_pattern = *.log
# Пустое значение = общая папка downloads приложения
local_dest =

# Локальный файл .log или каталог выбираются в интерфейсе: Источник → Локальный .log / папка.
# Для локального источника SSH/SMB и настройка ConnectConf.cfg не требуются.
