name: AKUZ v4.10.0 Fable keygen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-v410-fable-keygen.yml'

permissions:
  contents: read

jobs:
  keygen:
    name: Generate one-time Fable RSA key
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Generate ephemeral RSA keypair
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          $env:FABLE_PRIVATE_PATH = 'E:\Software\Project\LogAkusExplorer\secrets\fable_review_v410_private.pem'
          @'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          private_path = Path(os.environ['FABLE_PRIVATE_PATH'])
          private_path.parent.mkdir(parents=True, exist_ok=True)
          private = rsa.generate_private_key(public_exponent=65537, key_size=3072)
          private_path.write_bytes(private.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption(),
          ))
          public = private.public_key().public_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PublicFormat.SubjectPublicKeyInfo,
          ).decode('ascii').strip()
          print('FABLE_PUBLIC_KEY_BEGIN')
          print(public)
          print('FABLE_PUBLIC_KEY_END')
          print('FABLE_PRIVATE_KEY_READY=PASS')
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Fable key generation failed' }
