name: AKUZ v4.10.0 Fable release review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-v410-fable-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Independent Claude Fable release review
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact release-candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run independent Fable review
        env:
          PYTHONUTF8: '1'
          FABLE_ENV_FILE: 'E:\Software\Project\LogAkusExplorer\secrets\fable.env'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw 'Checkout does not match GITHUB_SHA' }
          $version = (& python -c "import akuz_version; print(akuz_version.__version__)").Trim()
          if ($version -ne '4.10.0') { throw "Expected 4.10.0, got $version" }
          & python -B scripts/v410_fable_review.py
          if ($LASTEXITCODE -ne 0) { throw 'Fable release review failed or blocked release' }
