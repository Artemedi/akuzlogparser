name: Windows portable
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-portable.yml'
      - 'akuz_version.py'
      - 'akuz_html_explorer.py'
      - 'akuz_portable_check.py'
      - 'common.js'
      - 'errors.js'
      - 'index.js'
      - 'app_controls.js'
      - 'akuz_store.py'
      - 'akuz_app.py'
      - 'requirements*.txt'
      - 'README_PORTABLE.md'
      - 'RELEASE_NOTES.md'
      - 'README*.md'
      - 'CHANGELOG*.md'
      - 'ROADMAP_PERFORMANCE.md'
      - 'PERFORMANCE_NOTES.md'
      - 'ConnectConf.example.cfg'
      - 'scripts/build_portable.py'
      - 'scripts/smoke_portable.py'
  workflow_dispatch:
    inputs:
      draft_release:
        description: Upload to a draft GitHub Release instead of Actions artifacts
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: akuz-windows-portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: write
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact DBA-008D revision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) {
            throw 'Checkout does not match GITHUB_SHA'
          }
          & python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python unavailable' }
          Write-Host "EXACT_SHA=$actual"
          Write-Host 'PORTABLE_RUNNER_GATE=PASS'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test application
        run: python -m unittest discover -s tests -v
      - name: Test browser controls
        run: node --test tests/test_app_controls.cjs tests/test_hourly_view.cjs
      - name: Build portable ZIP
        run: python scripts/build_portable.py
      - name: Verify packaged executable
        run: python scripts/smoke_portable.py dist/AKUZLogExplorer-windows-x64.zip
      - name: Upload verified build to draft release
        if: ${{ inputs.draft_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_portable.py
      - name: RC package gate complete
        if: ${{ !inputs.draft_release }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'dist/AKUZLogExplorer.exe') -or
              -not (Test-Path 'dist/AKUZLogExplorer-windows-x64.zip') -or
              -not (Test-Path 'dist/SHA256SUMS.txt')) {
            throw 'Verified RC outputs missing'
          }
          Write-Host 'PORTABLE_BUILD=PASS'
          Write-Host 'PORTABLE_SMOKE=PASS'
          Write-Host 'ACTIONS_ARTIFACT_UPLOAD=SKIPPED_QUOTA'
          Write-Host 'PUBLIC_RELEASE_CHANGED=NO'
