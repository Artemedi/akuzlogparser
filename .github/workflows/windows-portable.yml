name: Windows portable
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Upload to a draft GitHub Release instead of Actions artifacts
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test application
        run: python -m unittest discover -s tests -v
      - name: Test browser controls
        run: node --test tests/test_app_controls.cjs tests/test_hourly_view.cjs
      - name: Build portable ZIP
        run: python scripts/build_portable.py
      - name: Verify packaged executable
        run: python scripts/smoke_portable.py dist/AKUZLogExplorer-windows-x64.zip
      - name: Upload verified build to draft release
        if: ${{ inputs.draft_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_portable.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.draft_release }}
        with:
          name: AKUZLogExplorer-windows-x64
          path: |
            dist/AKUZLogExplorer.exe
            dist/AKUZLogExplorer-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
