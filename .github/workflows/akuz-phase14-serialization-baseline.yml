name: AKUZ Phase 14 serialization baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase14-serialization-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akuz-phase14-serialization-baseline
  cancel-in-progress: true

jobs:
  baseline:
    name: Real report serialization metrics on DBA-008D
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact P14-00 revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner and P14-00 instrumentation contract
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) {
            throw 'Checkout does not match GITHUB_SHA'
          }
          & python -B -m unittest discover -s tests -p 'test_phase14_serialization_metrics.py' -q
          if ($LASTEXITCODE -ne 0) { throw 'P14 serialization contract failed' }
          & python -B -m unittest discover -s tests -p 'test_phase6_instrumentation.py' -q
          if ($LASTEXITCODE -ne 0) { throw 'Legacy instrumentation contract failed' }
          Write-Host "EXACT_SHA=$actual"
          Write-Host 'PHASE14_INSTRUMENTATION_PRE_GATE=PASS'

      - name: Run real 23-24-25 serialization baseline
        run: |
          $ErrorActionPreference = 'Stop'
          $privateRoot = 'E:\Software\Project\LogAkusExplorer\akuzlogparser'
          $result = Join-Path $privateRoot ("diagnostics\phase14_serialization_" + $env:GITHUB_RUN_ID + ".json")
          & python -B scripts/bench_phase14_serialization.py `
            --config (Join-Path $privateRoot 'ConnectConf.cfg') `
            --app-root $privateRoot `
            --result $result
          if ($LASTEXITCODE -ne 0) { throw 'P14 real baseline failed' }
          Write-Host 'REAL_REPORTS=23_24_25_SEP'
          Write-Host 'INSTRUMENTATION_ONLY=YES'
          Write-Host 'RAW_LOG_ARTIFACT_UPLOAD=NO'
          Write-Host 'APP_CACHE_CHANGED=NO'
          Write-Host 'RELEASE_CHANGED=NO'

      - name: Diff hygiene
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          Write-Host 'DIFF_CHECK=PASS'
