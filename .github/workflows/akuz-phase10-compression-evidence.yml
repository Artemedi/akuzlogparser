name: AKUZ Phase 10 compression evidence audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase10-compression-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only Phase 10 A-B evidence audit on DBA-008D
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Audit private numeric A-B evidence only
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          @'
          import json
          from pathlib import Path
          import statistics
          import sys

          root = Path(r'E:\Software\Project\LogAkusExplorer\akuzlogparser\diagnostics')
          files = {
              '20260923': root / 'phase10_ssh_compression_ab_20260923_20260928.json',
              '20260925': root / 'phase10_ssh_compression_ab_20260925_20260928.json',
          }
          try:
              for day, path in files.items():
                  data = json.loads(path.read_text(encoding='utf-8'))
                  if data['day'] != day:
                      raise AssertionError('day mismatch')
                  if data.get('raw_payload_saved') is not False:
                      raise AssertionError('payload retention boundary failed')
                  if data.get('server_page_cache_controlled') is not False:
                      raise AssertionError('unexpected cache-control claim')
                  trials = data['trials']
                  if len(trials) != 6:
                      raise AssertionError('expected six trials')
                  if [x['mode'] for x in trials] != [
                          'control','compressed','compressed',
                          'control','control','compressed']:
                      raise AssertionError('unexpected order')
                  if len({x['snapshot_sha256'] for x in trials}) != 1:
                      raise AssertionError('fixed prefix SHA mismatch')
                  if {x['logical_bytes'] for x in trials} != {
                          data['fixed_prefix_bytes']}:
                      raise AssertionError('logical byte mismatch')
                  for mode in ('control','compressed'):
                      rows=[x for x in trials if x['mode']==mode]
                      if len(rows)!=3:
                          raise AssertionError('trial count mismatch')
                      walls=[x['wall_s'] for x in rows]
                      rx=[x['socket_rx_bytes'] for x in rows]
                      scpu=[x['server_sshd_cpu_s'] for x in rows]
                      ccpu=[x['client_cpu_s'] for x in rows]
                      print('PHASE10_AUDIT',day,mode,
                            'wall_s=' + ','.join(f'{v:.6f}' for v in walls),
                            'socket_rx=' + ','.join(str(v) for v in rx),
                            'server_cpu_s=' + ','.join(f'{v:.6f}' for v in scpu),
                            'client_cpu_s=' + ','.join(f'{v:.6f}' for v in ccpu))
                      print('PHASE10_RANGE',day,mode,
                            f'wall_min={min(walls):.6f}',
                            f'wall_median={statistics.median(walls):.6f}',
                            f'wall_max={max(walls):.6f}')
                  print('PHASE10_SOURCE_GREW',day,int(bool(data['source_grew_during_trials'])))
                  print('PHASE10_PREFIX_BYTES',day,data['fixed_prefix_bytes'])
              print('PHASE10_EVIDENCE_AUDIT=PASS')
              print('NO_SHA_PATH_HOST_OR_PAYLOAD_PRINTED=PASS')
          except BaseException as exc:
              print('PHASE10_EVIDENCE_AUDIT_FAILED', type(exc).__name__)
              sys.exit(1)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Phase 10 evidence audit failed' }
