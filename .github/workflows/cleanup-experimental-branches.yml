name: Cleanup experimental branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-experimental-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all phase branches except main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "akuz-branch-cleanup",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req) as r:
                  return r.read()

          page = 1
          branches = []
          while True:
              data = json.loads(request(
                  f"https://api.github.com/repos/{repo}/branches?per_page=100&page={page}"
              ))
              if not data:
                  break
              branches.extend(row["name"] for row in data)
              if len(data) < 100:
                  break
              page += 1

          targets = sorted(name for name in branches if name.startswith("phase"))
          print("DELETE_TARGETS=" + ",".join(targets))
          for name in targets:
              ref = urllib.parse.quote(f"heads/{name}", safe="/")
              request(f"https://api.github.com/repos/{repo}/git/refs/{ref}", method="DELETE")
              print(f"DELETED={name}")

          remaining = []
          page = 1
          while True:
              data = json.loads(request(
                  f"https://api.github.com/repos/{repo}/branches?per_page=100&page={page}"
              ))
              if not data:
                  break
              remaining.extend(row["name"] for row in data)
              if len(data) < 100:
                  break
              page += 1
          print("REMAINING=" + ",".join(sorted(remaining)))
          if remaining != ["main"]:
              raise SystemExit(f"Unexpected remaining branches: {remaining}")
          PY
