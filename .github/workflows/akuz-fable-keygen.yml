name: AKUZ Fable review ephemeral keygen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-fable-keygen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keygen:
    name: Generate one-time local Fable review key
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Generate RSA keypair and expose public key only
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          @'
          from pathlib import Path
          import base64
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          folder = Path(r'E:\Software\Project\LogAkusExplorer\secrets')
          folder.mkdir(parents=True, exist_ok=True)
          private_path = folder / 'fable_review_ephemeral_private.pem'
          private = rsa.generate_private_key(public_exponent=65537, key_size=3072)
          private_path.write_bytes(private.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption()))
          public = private.public_key().public_bytes(
              serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo)
          print('FABLE_REVIEW_PUBLIC_KEY_B64=' +
                base64.b64encode(public).decode('ascii'))
          print('FABLE_REVIEW_PRIVATE_KEY_LOCAL_ONLY=PASS')
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Fable review key generation failed' }
