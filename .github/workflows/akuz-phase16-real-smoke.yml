name: AKUZ Phase 16 real cache smoke

on:
  push:
    branches: [phase16-cache-ui]
    paths:
      - '.github/workflows/akuz-phase16-real-smoke.yml'
      - 'akuz_store.py'
      - 'akuz_app.py'
      - 'scripts/check_phase16_real_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akuz-phase16-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Real 23-Sep cache-clear smoke on DBA-008D
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact runner and SHA
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') { throw 'DBA-008D only' }
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw 'Wrong checkout' }
          Write-Host "EXACT_SHA=$actual"
      - name: Run disposable real cache smoke
        run: |
          $ErrorActionPreference = 'Stop'
          $privateRoot='E:\Software\Project\LogAkusExplorer\akuzlogparser'
          python -B scripts/check_phase16_real_smoke.py --config (Join-Path $privateRoot 'ConnectConf.cfg') --app-root $privateRoot
          if ($LASTEXITCODE -ne 0) { throw 'Phase 16 real smoke failed' }
      - name: Privacy and diff gate
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }
          Write-Host 'NO_ARTIFACT_UPLOAD=PASS'
          Write-Host 'PUBLIC_RELEASE_CHANGED=NO'
