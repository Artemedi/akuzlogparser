name: AKUZ v4.7 failed-fetch diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-v47-failed-fetch-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect Windows termination evidence around 14:09
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Query Windows crash and resource exhaustion evidence
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          $start = [datetime]'2026-09-28 14:08:30'
          $end   = [datetime]'2026-09-28 14:10:30'

          function Emit-SafeEvent($e, $label) {
            $msg = [string]$e.Message
            $app = ''
            $module = ''
            $code = ''
            if ($msg -match '(?im)Faulting application name:\s*([^,\r\n]+)') { $app = $matches[1].Trim() }
            if ($msg -match '(?im)Faulting module name:\s*([^,\r\n]+)') { $module = $matches[1].Trim() }
            if ($msg -match '(?im)Exception code:\s*([^\r\n]+)') { $code = $matches[1].Trim() }
            Write-Host ("WIN_EVENT label={0} time={1:o} provider={2} id={3} level={4} app={5} module={6} code={7}" -f $label,$e.TimeCreated,$e.ProviderName,$e.Id,$e.LevelDisplayName,$app,$module,$code)
          }

          $appEvents = Get-WinEvent -FilterHashtable @{
            LogName='Application'; StartTime=$start; EndTime=$end
          } -ErrorAction SilentlyContinue | Where-Object {
            $_.ProviderName -in @('Application Error','Windows Error Reporting') -or $_.Id -in @(1000,1001,1002)
          }
          foreach ($e in $appEvents) { Emit-SafeEvent $e 'application' }

          $sysEvents = Get-WinEvent -FilterHashtable @{
            LogName='System'; StartTime=$start; EndTime=$end
          } -ErrorAction SilentlyContinue | Where-Object {
            $_.LevelDisplayName -in @('Error','Critical','Warning')
          }
          foreach ($e in $sysEvents) {
            Write-Host ("WIN_EVENT label=system time={0:o} provider={1} id={2} level={3}" -f $e.TimeCreated,$e.ProviderName,$e.Id,$e.LevelDisplayName)
          }

          try {
            $resource = Get-WinEvent -FilterHashtable @{
              LogName='Microsoft-Windows-Resource-Exhaustion-Detector/Operational'
              StartTime=$start; EndTime=$end
            } -ErrorAction Stop
            foreach ($e in $resource) {
              Write-Host ("WIN_EVENT label=resource time={0:o} provider={1} id={2} level={3}" -f $e.TimeCreated,$e.ProviderName,$e.Id,$e.LevelDisplayName)
            }
          } catch {
            Write-Host 'RESOURCE_LOG_UNAVAILABLE=1'
          }

          $werRoot = 'C:\ProgramData\Microsoft\Windows\WER\ReportArchive'
          if (Test-Path $werRoot) {
            $hits = Get-ChildItem $werRoot -Directory -ErrorAction SilentlyContinue | Where-Object {
              $_.LastWriteTime -ge $start -and $_.LastWriteTime -le $end
            }
            Write-Host ("WER_ARCHIVES_IN_WINDOW={0}" -f @($hits).Count)
            foreach ($h in $hits) {
              $isAkuz = $h.Name -match 'AKUZLogExplorer|python'
              Write-Host ("WER_ARCHIVE time={0:o} akuz_like={1}" -f $h.LastWriteTime,$isAkuz)
            }
          } else {
            Write-Host 'WER_ARCHIVE_ROOT_MISSING=1'
          }
          Write-Host 'FAILED_FETCH_WINDOWS_DIAGNOSTICS=PASS'
