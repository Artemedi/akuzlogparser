name: AKUZ Phase 12 strict delta smoke 25Sep

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase12-delta-smoke-25sep.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akuz-phase12-delta-smoke-25sep
  cancel-in-progress: true

jobs:
  smoke:
    name: Strict delta proof-cost smoke on frozen 25-Sep source
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact Phase 12 benchmark revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner and isolated Phase 12 contract first
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) {
            throw 'Checkout does not match GITHUB_SHA'
          }
          & python -B -m unittest tests.test_phase12_delta_resume -q
          if ($LASTEXITCODE -ne 0) { throw 'Phase 12 synthetic contract failed' }
          Write-Host "EXACT_SHA=$actual"
          Write-Host 'PHASE12_SYNTHETIC_PRE_GATE=PASS'

      - name: Run read-only strict delta proof-cost smoke
        run: |
          $ErrorActionPreference = 'Stop'
          $privateRoot = 'E:\Software\Project\LogAkusExplorer\akuzlogparser'
          $result = Join-Path $privateRoot 'diagnostics\phase12_strict_delta_smoke_20260925_20260929.json'
          & python -B scripts/bench_phase12_delta_resume_smoke.py `
            --config (Join-Path $privateRoot 'ConnectConf.cfg') `
            --app-root $privateRoot `
            --day 20260925 `
            --previous-bytes 644034993 `
            --result $result
          if ($LASTEXITCODE -ne 0) { throw 'Phase 12 strict delta smoke failed' }
          Write-Host 'PHASE12_SCOPE=EXPERIMENTAL_NOT_RUNTIME'
          Write-Host 'SOURCE_MODE=READ_ONLY'
          Write-Host 'COMPRESSION_FORCED_OFF=PASS'
          Write-Host 'APP_CACHE_CHANGED=NO'
          Write-Host 'NO_RELEASE_CHANGE=PASS'
          Write-Host 'RAW_LOG_ARTIFACT_UPLOAD=NO'

# Rerun after final remote-prefix proof was bracketed by a second identity stat.
