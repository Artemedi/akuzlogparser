name: AKUZ Actions retention cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-actions-cleanup.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Remove superseded unreferenced workflow runs
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out documentation references
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Delete old completed runs not referenced by project docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import urllib.error
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          current = int(os.environ['GITHUB_RUN_ID'])
          token = os.environ['GH_TOKEN']
          root = Path.cwd()

          referenced = set()
          pattern = re.compile(r'github\.com/Artemedi/akuzlogparser/actions/runs/(\d+)')
          for path in root.rglob('*.md'):
              if '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              referenced.update(int(x) for x in pattern.findall(text))

          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'akuz-actions-retention-cleanup',
          }

          def request(url, method='GET'):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          runs = []
          page = 1
          while True:
              url = f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}'
              payload = request(url)
              chunk = payload.get('workflow_runs', [])
              runs.extend(chunk)
              if len(chunk) < 100:
                  break
              page += 1

          # Preserve the two newest runs of every workflow even if docs do not
          # link to them. This keeps immediate diagnostics while discarding
          # superseded history. All in-progress/queued runs are always kept.
          newest = {}
          for row in runs:
              newest.setdefault(row['name'], [])
              if len(newest[row['name']]) < 2:
                  newest[row['name']].append(int(row['id']))
          protected_recent = {rid for ids in newest.values() for rid in ids}
          protected = referenced | protected_recent | {current}

          candidates = []
          for row in runs:
              rid = int(row['id'])
              if row['status'] != 'completed' or rid in protected:
                  continue
              candidates.append((rid, row['name'], row.get('conclusion')))

          deleted = 0
          failed = 0
          for rid, name, conclusion in candidates:
              try:
                  request(
                      f'https://api.github.com/repos/{repo}/actions/runs/{rid}',
                      method='DELETE')
                  deleted += 1
              except urllib.error.HTTPError as exc:
                  failed += 1
                  print(f'CLEANUP_DELETE_FAILED run={rid} status={exc.code}')
              except Exception as exc:
                  failed += 1
                  print(f'CLEANUP_DELETE_FAILED run={rid} kind={type(exc).__name__}')

          print(f'CLEANUP_TOTAL_RUNS={len(runs)}')
          print(f'CLEANUP_DOC_REFERENCED={len(referenced)}')
          print(f'CLEANUP_RECENT_PROTECTED={len(protected_recent)}')
          print(f'CLEANUP_CANDIDATES={len(candidates)}')
          print(f'CLEANUP_DELETED={deleted}')
          print(f'CLEANUP_FAILED={failed}')
          if failed:
              raise SystemExit('one or more workflow runs could not be deleted')
          print('ACTIONS_RETENTION_CLEANUP=PASS')
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Actions cleanup failed' }
