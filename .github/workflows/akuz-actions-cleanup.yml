name: AKUZ repository cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-actions-cleanup.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    name: Prune obsolete branches workflows runs and artifacts
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Repository cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          current_run = int(os.environ['GITHUB_RUN_ID'])
          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'akuz-final-cleanup',
          }

          def req(url, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              h = dict(headers)
              if data is not None:
                  h['Content-Type'] = 'application/json'
              r = urllib.request.Request(url, headers=h, data=data, method=method)
              with urllib.request.urlopen(r, timeout=60) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          base = f'https://api.github.com/repos/{repo}'

          # 1. Remove obsolete phase branches. Keep main only.
          branches = req(base + '/branches?per_page=100')
          deleted_branches = []
          for row in branches:
              name = row['name']
              if name == 'main':
                  continue
              if name.startswith('phase'):
                  ref = urllib.parse.quote('heads/' + name, safe='/')
                  req(base + '/git/refs/' + ref, method='DELETE')
                  deleted_branches.append(name)
          print('DELETED_BRANCHES=' + ','.join(sorted(deleted_branches)))

          # 2. Remove all Actions artifacts (release assets are separate and untouched).
          deleted_artifacts = 0
          page = 1
          while True:
              payload = req(base + f'/actions/artifacts?per_page=100&page={page}')
              rows = payload.get('artifacts', [])
              if not rows:
                  break
              for row in rows:
                  req(base + f"/actions/artifacts/{row['id']}", method='DELETE')
                  deleted_artifacts += 1
              if len(rows) < 100:
                  break
              page += 1
          print(f'DELETED_ACTIONS_ARTIFACTS={deleted_artifacts}')

          # 3. Remove all completed historical Actions runs except this cleanup run.
          runs = []
          page = 1
          while True:
              payload = req(base + f'/actions/runs?per_page=100&page={page}')
              rows = payload.get('workflow_runs', [])
              runs.extend(rows)
              if len(rows) < 100:
                  break
              page += 1
          deleted_runs = 0
          for row in runs:
              rid = int(row['id'])
              if rid == current_run or row['status'] != 'completed':
                  continue
              try:
                  req(base + f'/actions/runs/{rid}', method='DELETE')
                  deleted_runs += 1
              except urllib.error.HTTPError as exc:
                  print(f'RUN_DELETE_FAILED={rid}:{exc.code}')
                  raise
          print(f'DELETED_ACTION_RUNS={deleted_runs}')

          # 4. Remove obsolete workflow files. Keep only permanent regression + portable.
          obsolete = [
              '.github/workflows/akuz-phase14-serialization-baseline.yml',
              '.github/workflows/akuz-phase15-production.yml',
              '.github/workflows/akuz-windows-smoke.yml',
              '.github/workflows/cleanup-experimental-branches.yml',
          ]
          deleted_workflows = []
          for path in obsolete:
              encoded = urllib.parse.quote(path, safe='/')
              try:
                  info = req(base + '/contents/' + encoded + '?ref=main')
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      continue
                  raise
              req(
                  base + '/contents/' + encoded,
                  method='DELETE',
                  body={
                      'message': 'ci: remove obsolete workflow',
                      'sha': info['sha'],
                      'branch': 'main',
                  },
              )
              deleted_workflows.append(path)
          print('DELETED_WORKFLOWS=' + ','.join(deleted_workflows))

          # 5. Verify branch and workflow end-state before self-removal.
          branches = req(base + '/branches?per_page=100')
          names = sorted(row['name'] for row in branches)
          print('REMAINING_BRANCHES=' + ','.join(names))
          if names != ['main']:
              raise SystemExit('branch cleanup incomplete: ' + repr(names))

          listing = req(base + '/contents/.github/workflows?ref=main')
          wf_names = sorted(row['name'] for row in listing)
          allowed_with_self = [
              'akuz-actions-cleanup.yml',
              'akuz-windows-tests.yml',
              'windows-portable.yml',
          ]
          print('WORKFLOWS_BEFORE_SELF_DELETE=' + ','.join(wf_names))
          if wf_names != allowed_with_self:
              raise SystemExit('workflow cleanup incomplete: ' + repr(wf_names))

          # 6. Delete this cleanup workflow itself last.
          self_path = '.github/workflows/akuz-actions-cleanup.yml'
          encoded = urllib.parse.quote(self_path, safe='/')
          info = req(base + '/contents/' + encoded + '?ref=main')
          req(
              base + '/contents/' + encoded,
              method='DELETE',
              body={
                  'message': 'ci: remove completed cleanup workflow',
                  'sha': info['sha'],
                  'branch': 'main',
              },
          )
          print('SELF_CLEANUP_WORKFLOW_DELETED=PASS')
          print('REPOSITORY_CLEANUP=PASS')
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Repository cleanup failed' }
