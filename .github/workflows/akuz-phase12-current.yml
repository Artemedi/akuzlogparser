name: AKUZ Phase 12 current acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase12-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akuz-phase12-current
  cancel-in-progress: true

jobs:
  v2:
    name: Replicated full vs single-proof delta on 25-Sep
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact current Phase 12 revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner and Phase 12 synthetic contract
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) {
            throw 'Checkout does not match GITHUB_SHA'
          }
          & python -B -m unittest discover -s tests -p 'test_phase12_delta_resume.py' -q
          if ($LASTEXITCODE -ne 0) { throw 'Phase 12 synthetic contract failed' }
          Write-Host "EXACT_SHA=$actual"
          Write-Host 'PHASE12_SYNTHETIC_PRE_GATE=PASS'

      - name: Run balanced v2 replicated A-B
        run: |
          $ErrorActionPreference = 'Stop'
          $privateRoot = 'E:\Software\Project\LogAkusExplorer\akuzlogparser'
          $result = Join-Path $privateRoot 'diagnostics\phase12_v2_delta_ab_20260925_20260929.json'
          & python -B scripts/bench_phase12_delta_resume_v2_ab.py `
            --config (Join-Path $privateRoot 'ConnectConf.cfg') `
            --app-root $privateRoot `
            --day 20260925 `
            --previous-bytes 644034993 `
            --result $result
          if ($LASTEXITCODE -ne 0) { throw 'Phase 12 v2 replicated A-B failed' }
          Write-Host 'PHASE12_SCOPE=V2_REPLICATED_EXPERIMENT_NOT_RUNTIME'
          Write-Host 'COMPRESSION_FORCED_OFF=PASS'
          Write-Host 'APP_CACHE_CHANGED=NO'
          Write-Host 'NO_RELEASE_CHANGE=PASS'
          Write-Host 'RAW_LOG_ARTIFACT_UPLOAD=NO'
