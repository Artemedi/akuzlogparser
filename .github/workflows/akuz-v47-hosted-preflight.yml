name: AKUZ v4.7 hosted build preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-v47-hosted-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          architecture: x64
      - shell: pwsh
        run: |
          python --version
          node --version
          if ((python -c "import akuz_version; print(akuz_version.__version__)").Trim() -ne '4.7.0') {
            throw 'Unexpected release version'
          }
          Write-Host 'V47_HOSTED_PREFLIGHT=PASS'
