name: AKUZ Phase 9.4 local SHA I/O probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase94-local-sha-cost.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one_read:
    name: Read-only local SHA cost on DBA-008D
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: One SHA read on three previously frozen local AKUZ snapshots
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          @'
          from pathlib import Path
          from time import perf_counter, process_time
          import hashlib
          import json
          import sys
          
          def main():
              root = Path('E:/Software/Project/LogAkusExplorer/akuzlogparser')
              private = root / 'diagnostics/private_phase94_combined_only_real_win32_v1.json'
              reference = json.loads(private.read_text(encoding='utf-8'))
              if reference.get('code_sha', '')[:7] != '4743f9a':
                  raise AssertionError('Unexpected benchmark source identity reference')
              entries = reference.get('sources', [])
              if len(entries) != 3 or sum(x['bytes'] for x in entries) != 955774851:
                  raise AssertionError('Unexpected source inventory')
              total_bytes = 0
              total_wall = 0.
              total_cpu = 0.
              downloads = root / 'downloads'
              for row in entries:
                  day = row['date']
                  if day not in ('20260923', '20260924', '20260925'):
                      raise AssertionError('Unexpected date')
                  matches = [p for p in downloads.glob('*_' + day + '_server.log')
                             if p.is_file() and not p.is_symlink()]
                  if len(matches) != 1:
                      raise AssertionError('Missing or ambiguous frozen local snapshot')
                  source = matches[0]
                  stat = source.stat()
                  before = (stat.st_dev, stat.st_ino, stat.st_size, stat.st_mtime_ns)
                  if stat.st_size != row['bytes']:
                      raise AssertionError('Input size mismatch')
                  digest = hashlib.sha256()
                  wall_start, cpu_start = perf_counter(), process_time()
                  with source.open('rb') as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                          digest.update(chunk)
                  elapsed, cpu = perf_counter() - wall_start, process_time() - cpu_start
                  stat = source.stat()
                  after = (stat.st_dev, stat.st_ino, stat.st_size, stat.st_mtime_ns)
                  if before != after or digest.hexdigest() != row['sha256']:
                      raise AssertionError('Source mutated or SHA mismatched')
                  total_bytes += row['bytes']
                  total_wall += elapsed
                  total_cpu += cpu
                  print('LOCAL_SHA_IO_PROBE_PASS day=%s bytes=%d wall_s=%.5f cpu_s=%.5f'
                        % (day,row['bytes'],elapsed,cpu))
              if total_bytes != 955774851:
                  raise AssertionError('Aggregate source bytes differ')
              print('LOCAL_SHA_IO_PROBE_TOTAL bytes=%d sum_wall_s=%.5f sum_cpu_s=%.5f'
                    % (total_bytes,total_wall,total_cpu))
              print('SINGLE_SEQUENTIAL_READ_OBSERVATION_NOT_APP_CACHE_GATE=PASS')
              print('NO_RAW_LOG_DATA_OR_SOURCE_SHA_PRINTED=PASS')
          
          try:
              main()
          except Exception as exc:
              print('LOCAL_SHA_IO_PROBE_FAILED',type(exc).__name__)
              sys.exit(1)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Private source SHA read-only probe failed' }
