name: AKUZ Phase 11 corrected process overlap 23+24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase11-process-overlap-corrected.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Corrected balanced serial-process replication on 23+24 Sep
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out corrected process-isolation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run corrected serial process process serial trials
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          $privateRoot = 'E:\Software\Project\LogAkusExplorer\akuzlogparser'
          $diagnostics = Join-Path $privateRoot 'diagnostics'
          python -B scripts/bench_phase11_process_overlap.py `
            --config (Join-Path $privateRoot 'ConnectConf.cfg') `
            --app-root $privateRoot `
            --diagnostics $diagnostics `
            --result (Join-Path $diagnostics 'phase11_process_overlap_23_24_corrected_20260928.json')
          if ($LASTEXITCODE -ne 0) { throw 'Corrected Phase 11 process-isolation benchmark failed' }
          Write-Host 'PHASE11_SCOPE=CORRECTED_PROCESS_ISOLATION_RERUN_NOT_PRODUCTION'
          Write-Host 'FETCH_WALL_AND_READY_LATENCY_SEPARATED=PASS'
          Write-Host 'COMPRESSION_FORCED_OFF=PASS'
          Write-Host 'NO_RELEASE_CHANGE=PASS'
