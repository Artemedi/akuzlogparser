name: AKUZ Phase 15 production opt-in

on:
  push:
    branches: [phase15-production-optin]
    paths:
      - '.github/workflows/akuz-phase15-production.yml'
      - 'akuz_app.py'
      - 'akuz_parallel_reports.py'
      - 'scripts/bench_phase15_normal_app.py'
      - 'tests/test_phase15_production_parallel.py'

permissions:
  contents: read

concurrency:
  group: akuz-phase15-production
  cancel-in-progress: true

jobs:
  gate:
    name: Phase 15 normal-app candidate on DBA-008D
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact runner and SHA
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') { throw 'DBA-008D only' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw 'Checkout does not match GITHUB_SHA' }
          Write-Host "EXACT_SHA=$actual"

      - name: Production policy and normal-app synthetic parity
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest tests.test_phase15_production_parallel -q
          if ($LASTEXITCODE -ne 0) { throw 'Phase 15 production focused tests failed' }
          Write-Host 'PHASE15_PRODUCTION_SYNTHETIC=PASS'

      - name: Full Python and browser regression
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Python regression failed' }
          node --test tests/test_app_controls.cjs tests/test_hourly_view.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser regression failed' }
          Write-Host 'PHASE15_FULL_REGRESSION=PASS'

      - name: Real normal-app B-C-C-B-B-C
        run: |
          $ErrorActionPreference = 'Stop'
          $privateRoot = 'E:\Software\Project\LogAkusExplorer\akuzlogparser'
          python -B scripts/bench_phase15_normal_app.py --config (Join-Path $privateRoot 'ConnectConf.cfg') --app-root $privateRoot
          if ($LASTEXITCODE -ne 0) { throw 'Phase 15 normal-app A-B failed' }

      - name: Privacy and diff gate
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          Write-Host 'NO_ARTIFACT_UPLOAD=PASS'
          Write-Host 'PUBLIC_RELEASE_CHANGED=NO'
