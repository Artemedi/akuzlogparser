name: AKUZ Windows hosted synthetic safety gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-windows-hosted-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Synthetic regression on GitHub-hosted Windows
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Python synthetic regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Python regression failed' }
          Write-Host 'HOSTED_PYTHON_REGRESSION=PASS'
      - name: Browser controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --test tests/test_app_controls.cjs tests/test_hourly_view.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser regression failed' }
          Write-Host 'HOSTED_BROWSER_REGRESSION=PASS'
      - name: Diff hygiene
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff check failed' }
          Write-Host 'HOSTED_DIFF_CHECK=PASS'
