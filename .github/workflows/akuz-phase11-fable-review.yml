name: AKUZ Phase 11 Fable independent review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase11-fable-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Claude Fable independent production review
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Ask Fable for two focused production reviews
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }

          $projectRoot = 'E:\Software\Project\LogAkusExplorer'
          $secretFile = $null
          if (Test-Path $projectRoot) {
            $matches = @(Get-ChildItem $projectRoot -Filter 'fable.env' -File -Recurse -ErrorAction SilentlyContinue)
            if ($matches.Count -eq 1) {
              $secretFile = $matches[0].FullName
              Write-Host 'FABLE_SECRET_SOURCE=LOCAL_ENV_FILE'
            } elseif ($matches.Count -gt 1) {
              throw ('Multiple fable.env files found: ' + $matches.Count)
            }
          }
          if ($secretFile) {
            Get-Content $secretFile | ForEach-Object {
              $line = $_.Trim()
              if (-not $line -or $line.StartsWith('#') -or -not $line.Contains('=')) { return }
              $pair = $line.Split('=', 2)
              [Environment]::SetEnvironmentVariable(
                $pair[0].Trim(), $pair[1].Trim().Trim('"').Trim("'"), 'Process')
            }
          } else {
            Write-Host 'FABLE_SECRET_SOURCE=ONE_TIME_RSA_BLOB'
          }
          $env:FABLE_REVIEW_PRIVATE_KEY = 'E:\Software\Project\LogAkusExplorer\secrets\fable_review_ephemeral_private.pem'

          @'
          import base64
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          token = os.environ.get('ANTHROPIC_AUTH_TOKEN', '')
          base = os.environ.get('ANTHROPIC_BASE_URL', '').rstrip('/')
          model = os.environ.get('ANTHROPIC_MODEL', 'claude-fable-5.1')
          private_path = Path(os.environ.get('FABLE_REVIEW_PRIVATE_KEY', ''))
          encrypted_path = Path('.github/fable_review_secret.enc.b64')
          used_encrypted = False

          if (not token or not base) and private_path.is_file() and encrypted_path.is_file():
              from cryptography.hazmat.primitives import hashes, serialization
              from cryptography.hazmat.primitives.asymmetric import padding
              private = serialization.load_pem_private_key(
                  private_path.read_bytes(), password=None)
              ciphertext = base64.b64decode(
                  encrypted_path.read_text(encoding='ascii').strip())
              plaintext = private.decrypt(
                  ciphertext,
                  padding.OAEP(
                      mgf=padding.MGF1(algorithm=hashes.SHA256()),
                      algorithm=hashes.SHA256(),
                      label=None)).decode('utf-8')
              values = {}
              for raw in plaintext.splitlines():
                  raw = raw.strip()
                  if not raw or raw.startswith('#') or '=' not in raw:
                      continue
                  name, value = raw.split('=', 1)
                  values[name.strip()] = value.strip().strip('"').strip("'")
              token = values.get('ANTHROPIC_AUTH_TOKEN', '')
              base = values.get('ANTHROPIC_BASE_URL', '').rstrip('/')
              model = values.get('ANTHROPIC_MODEL', model)
              used_encrypted = True

          if not token or not base:
              raise SystemExit('Fable API environment incomplete')

          def call_fable(label, prompt, max_tokens):
              payload = json.dumps({
                  'model': model,
                  'max_tokens': max_tokens,
                  'messages': [{'role': 'user', 'content': prompt}]
              }, ensure_ascii=False).encode('utf-8')
              request_path = None
              try:
                  with tempfile.NamedTemporaryFile(
                          mode='wb', suffix='.json', delete=False) as request_file:
                      request_file.write(payload)
                      request_path = request_file.name
                  config = (
                      'url = "' + base + '/chat/completions"\n'
                      'header = "Authorization: Bearer ' + token + '"\n'
                      'header = "Content-Type: application/json"\n'
                      'header = "User-Agent: curl/8"\n'
                      'data-binary = "@' + request_path.replace('\\', '/') + '"\n'
                  )
                  proc = subprocess.run(
                      ['curl', '--silent', '--show-error', '--max-time', '300',
                       '--write-out', '\n%{http_code}', '--config', '-'],
                      input=config.encode('utf-8'),
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      timeout=320)
                  raw = proc.stdout.decode('utf-8', 'replace')
                  if '\n' not in raw:
                      raise SystemExit(label + ': malformed curl response')
                  body, status = raw.rsplit('\n', 1)
                  if proc.returncode or not status.startswith('2'):
                      print('FABLE_HTTP_FAILURE label=' + label +
                            ' status=' + status +
                            ' curl_exit=' + str(proc.returncode))
                      raise SystemExit(label + ': Fable HTTP request failed')
                  data = json.loads(body)
              finally:
                  if request_path:
                      Path(request_path).unlink(missing_ok=True)

              choice = data['choices'][0]
              message = choice.get('message', {})
              content = message.get('content', '')
              if not isinstance(content, str) or not content.strip():
                  usage = data.get('usage', {})
                  print('FABLE_EMPTY_CONTENT label=' + label +
                        ' finish=' + str(choice.get('finish_reason')) +
                        ' completion_tokens=' +
                        str(usage.get('completion_tokens')))
                  raise SystemExit(label + ': Fable returned empty review')
              print('FABLE_REVIEW_BEGIN ' + label)
              print(content)
              print('FABLE_REVIEW_END ' + label)
              match = re.search(
                  r'(?im)^\s*VERDICT\s*:\s*(ACCEPT|MODIFY|BLOCK)\s*$',
                  content)
              if not match:
                  raise SystemExit(label + ': missing exact VERDICT line')
              return match.group(1)

          process_code = Path('akuz_process_fetch.py').read_text(encoding='utf-8')
          lifecycle_test_source = Path(
              'tests/test_phase11_process_lifecycle.py').read_text(encoding='utf-8')
          lifecycle_tests = '\n'.join(
              re.findall(r'^\\s*def (test_[A-Za-z0-9_]+)', lifecycle_test_source, re.M))

          app = Path('akuz_app.py').read_text(encoding='utf-8')
          cleanup_start = app.index('def _phase11_prefetch_prefix')
          cleanup_end = app.index('\ndef perform_build(', cleanup_start)
          gate_start = app.index("    process_flag = ")
          gate_end = app.index("    (root/'cache').mkdir", gate_start)
          ops_start = app.index('    def start_next_prefetch')
          ops_end = app.index('    for idx, fid in enumerate(ids, 1):', ops_start)
          loop_start = app.index('        prefetch = start_next_prefetch')
          loop_end = app.index('    combined = None', loop_start)
          spool_start = app.index('def _iter_combined_sources')
          spool_end = app.index('\ndef _combine_sources', spool_start)
          app_phase11 = (
              app[cleanup_start:cleanup_end] + '\n...\n' +
              app[gate_start:gate_end] + '\n...\n' +
              app[ops_start:ops_end] + '\n...\n' +
              app[loop_start:loop_end] + '\n...\n' +
              app[spool_start:spool_end])
          fetch_source = Path('akuz_fetch.py').read_text(encoding='utf-8')
          fetch_start = fetch_source.index('def fetch_selected')
          fetch_end = fetch_source.index(
              'fetch_selected._akuz_process_prefetch_compatible', fetch_start)
          fetch_selected_code = fetch_source[fetch_start:fetch_end]
          app_test_source = Path(
              'tests/test_phase11_normal_app_process_prefetch.py'
          ).read_text(encoding='utf-8')
          app_tests = '\n'.join(
              re.findall(r'^\\s*def (test_[A-Za-z0-9_]+)', app_test_source, re.M))

          lifecycle_prompt = """
          Independent senior review. This code is proposed as the default
          Windows/PyInstaller SSH prefetch lifecycle for AKUZ Log Explorer.
          Find concrete release-blocking bugs; do not praise it.

          Check Windows spawn, Process/Pipe ownership, timeout, terminate/kill,
          parent hard-exit watchdog, child crash/EOF, cleanup, handle/thread
          lifetime, sanitized IPC, and whether any scenario can leave a child
          alive or a partial snapshot trusted as complete.

          Evidence: real Windows spawn + forced abort tests pass; packaged
          PyInstaller spawn self-test passes. Treat tests as evidence, not proof.

          Return <=500 words:
          BLOCKERS
          HIGH
          MISSING TESTS
          VERDICT: ACCEPT|MODIFY|BLOCK
          The VERDICT line must be alone on its line.

          ===== akuz_process_fetch.py =====
          """ + process_code + """
          ===== lifecycle test names =====
          """ + lifecycle_tests

          transaction_prompt = """
          Independent senior review. Review only the normal-app Phase 11
          one-ahead process-prefetch transaction below as a default production
          path. Find concrete reproducible correctness/reliability bugs.

          Focus on:
          - Linux/SSH-only gating and default-on rollback switch;
          - stale/warm/mixed cache and no unnecessary refetch;
          - remote growth/rotation/truncation;
          - ordering of temp snapshot, inventory persistence and final rename;
          - hard crash at every boundary and restart recovery;
          - inventory save failure and compensation;
          - child failure/timeout serial fallback;
          - single report publication while child runs;
          - combined/analytics semantics;
          - orphan workspace cleanup;
          - whether local/SMB/custom generators can accidentally enter it.

          Important surrounding semantics to verify rather than assume:
          - child fetch uses the same fetch_selected() as serial: trusted-path
            re-list, device/inode check, stat-before, bounded head read,
            stat-after, rotation/truncation rejection and active-log trimming;
          - an unindexed final file is intentionally fail-closed: the serial
            fetch also refuses dest.exists(), so treating an arbitrary external
            final as a warm hit would weaken integrity;
          - derived spools are disposable acceleration only. A missing spool
            entry makes _iter_combined_sources parse event_stream normally;
          - owned prefetch workspaces are purged for every Linux build even when
            AKUZ_PHASE11_PROCESS_PREFETCH=0.

          Current evidence: full Windows regression, real normal-app A/B
          inventory/analytics parity and portable spawn/smoke have passed on
          the current runtime lineage. Persistent B-lite is not used and SSH
          compression remains default OFF.

          Return <=700 words:
          BLOCKERS
          HIGH
          MISSING TESTS
          VERDICT: ACCEPT|MODIFY|BLOCK
          The VERDICT line must be alone on its line.

          ===== Phase 11 normal-app code =====
          """ + app_phase11 + """
          ===== fetch_selected SSH snapshot contract =====
          """ + fetch_selected_code + """
          ===== normal-app test names =====
          """ + app_tests

          verdicts = [
              call_fable('LIFECYCLE', lifecycle_prompt, 7000),
              call_fable('TRANSACTION', transaction_prompt, 9000),
          ]
          rank = {'ACCEPT': 0, 'MODIFY': 1, 'BLOCK': 2}
          overall = max(verdicts, key=lambda value: rank[value])
          print('FABLE_LIFECYCLE_VERDICT=' + verdicts[0])
          print('FABLE_TRANSACTION_VERDICT=' + verdicts[1])
          print('FABLE_OVERALL_VERDICT=' + overall)
          print('FABLE_MODEL=' + model)
          print('NO_PRIVATE_LOGS_OR_SECRETS_SENT=PASS')

          if overall == 'ACCEPT' and used_encrypted:
              private_path.unlink(missing_ok=True)
              print('FABLE_EPHEMERAL_PRIVATE_KEY_DESTROYED=PASS')
          if overall != 'ACCEPT':
              raise SystemExit('Fable review requires changes: ' + overall)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Fable independent review failed' }
