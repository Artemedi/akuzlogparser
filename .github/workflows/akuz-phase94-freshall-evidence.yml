name: AKUZ Phase 9.4 local fresh-all evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase94-freshall-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only nine-trial evidence gate on DBA-008D
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Verify owner-approved local evidence (never upload raw logs)
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'This read-only evidence gate is restricted to DBA-008D'
          }
          $folder = 'E:\Software\Project\LogAkusExplorer\akuzlogparser\diagnostics'
          $freshPath = Join-Path $folder 'private_phase94_fresh_all_real_win32_v1.json'
          $combinedPath = Join-Path $folder 'private_phase94_combined_only_real_win32_v1.json'
          if (-not (Test-Path -LiteralPath $freshPath -PathType Leaf)) {
            throw 'The finished local fresh-all evidence file is not present. No experiment was restarted.'
          }
          if (-not (Test-Path -LiteralPath $combinedPath -PathType Leaf)) {
            throw 'The earlier local combined-only source identity baseline is missing.'
          }
          $fresh = Get-Content -LiteralPath $freshPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $prior = Get-Content -LiteralPath $combinedPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($fresh.status -ne 'real_fresh_all_standalone_NOT_app_cache_gate') {
            throw 'Evidence status is not the complete real fresh-all standalone gate'
          }
          if ($fresh.code_sha -ne 'a65007bb66196a9c24c6579151b4d557355cb45e') {
            throw 'Evidence was recorded for another code revision'
          }
          if ($fresh.source_bytes -ne 955774851 -or $fresh.source_count -ne 3) {
            throw 'Frozen input byte count or source count changed'
          }
          if (@($fresh.sources).Count -ne 3 -or @($prior.sources).Count -ne 3) {
            throw 'Input SHA evidence is incomplete'
          }
          foreach ($i in 0..2) {
            $a = $fresh.sources[$i]
            $b = $prior.sources[$i]
            if ($a.date -ne $b.date -or $a.bytes -ne $b.bytes -or
                $a.sha256 -ne $b.sha256) {
              throw 'Fresh-all and previous combined-only source SHA evidence differ'
            }
          }
          if (-not $fresh.byte_parity -or -not $fresh.workspace_cleaned -or
              $fresh.raw_payload_saved -or @($fresh.trials).Count -ne 9 -or
              $fresh.trials_per_mode -ne 3) {
            throw 'Nine-trial parity, privacy, or cleanup gate failed'
          }
          foreach ($mode in @('control','tee','b_lite')) {
            $rows = @($fresh.trials | Where-Object { $_.mode -eq $mode })
            if ($rows.Count -ne 3) { throw 'Unexpected trial count for a mode' }
            foreach ($t in $rows) {
              if (-not $t.byte_parity -or $t.memory_samples -lt 20 -or
                  $t.unreadable_memory_samples -ne 0 -or
                  $t.peak_ws_bytes -le 0 -or
                  $t.sampled_private_peak_bytes -le 0 -or
                  $t.report_bytes -le 0 -or $t.wall_s -le 0 -or
                  $t.cpu_s -le 0) { throw 'One trial has invalid metrics or parity' }
              if ($mode -eq 'b_lite' -and $t.sidecar_bytes -le 0) {
                throw 'Expected bounded sidecar evidence is absent'
              }
              if ($mode -ne 'b_lite' -and $t.sidecar_bytes -ne 0) {
                throw 'Unexpected sidecar in a non-B-lite trial'
              }
            }
            $wall = $fresh.summary.$mode.wall_s
            $cpu = $fresh.summary.$mode.cpu_s
            Write-Host ("{0}: wall_min={1:N3}s wall_median={2:N3}s wall_max={3:N3}s cpu_median={4:N3}s" -f
                        $mode,$wall.min,$wall.median,$wall.max,$cpu.median)
          }
          if (@(Get-ChildItem -LiteralPath $folder -Directory -Filter 'phase94_fresh_all_*').Count -ne 0) {
            throw 'Owned fresh-all benchmark workspace has not been cleaned'
          }
          Write-Host 'FRESH_ALL_9_OF_9=PASS'
          Write-Host 'SAME_SOURCE_SHA_AS_COMBINED_ONLY=PASS'
          Write-Host 'NO_LOG_PAYLOAD_UPLOADED=PASS'
          Write-Host 'NO_PRODUCTION_ARCHITECTURE_CHANGE=PASS'
