name: AKUZ Phase 11 normal-app evidence audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase11-normal-app-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit private Phase 11 normal-app A-B evidence
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Validate numeric evidence without source identifiers
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') { throw 'DBA-008D only' }
          @'
          import json
          from pathlib import Path
          import sys

          path = Path(r'E:\Software\Project\LogAkusExplorer\akuzlogparser\diagnostics\phase11_normal_app_real_static_24_27_final_default_20260928.json')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('status') != 'PHASE11_NORMAL_APP_REAL_STATIC_ACCEPTANCE':
                  raise AssertionError('unexpected status')
              if data.get('days') != ['20260924','20260925','20260926','20260927']:
                  raise AssertionError('unexpected days')
              if data.get('source_bytes', 0) < 800_000_000:
                  raise AssertionError('source set too small')
              parity = data.get('parity', {})
              if not all(parity.get(k) for k in ('inventory','analytics_sql','analytics_exports')):
                  raise AssertionError('semantic parity failed')
              if not data.get('workspace_cleaned') or data.get('raw_payload_saved'):
                  raise AssertionError('cleanup/privacy failed')
              if data.get('source_digests_saved') or data.get('app_user_cache_changed') or data.get('release_changed'):
                  raise AssertionError('scope/privacy failed')
              serial = data['serial']; process = data['process']
              if serial['build']['prefetch_downloads'] != 0:
                  raise AssertionError('serial prefetched')
              if process['build']['prefetch_downloads'] < 2:
                  raise AssertionError('process path not exercised')
              if process['max_sampled_processes'] < 2:
                  raise AssertionError('child process not sampled')
              if serial['memory_samples'] < 10 or process['memory_samples'] < 10:
                  raise AssertionError('insufficient memory samples')
              if serial['unreadable_memory_samples'] or process['unreadable_memory_samples']:
                  raise AssertionError('unreadable memory samples')
              for name,row in (('serial',serial),('process',process)):
                  print('PHASE11_NORMAL_APP', name,
                        f"wall_s={row['wall_s']:.6f}",
                        f"parent_cpu_s={row['parent_cpu_s']:.6f}",
                        f"child_cpu_s={row['child_cpu_s']:.6f}",
                        f"total_cpu_s={row['total_cpu_s']:.6f}",
                        f"peak_private_bytes={row['peak_private_bytes']}",
                        f"max_processes={row['max_sampled_processes']}",
                        f"prefetch_downloads={row['build']['prefetch_downloads']}")
              delta = 100.0 * (process['wall_s'] / serial['wall_s'] - 1.0)
              print(f'PHASE11_NORMAL_APP_WALL_DELTA_PCT={delta:.3f}')
              print('PHASE11_FINAL_DEFAULT_INVENTORY_PARITY=PASS')
              print('PHASE11_FINAL_DEFAULT_SQL_PARITY=PASS')
              print('PHASE11_FINAL_DEFAULT_EXPORT_PARITY=PASS')
              print('PHASE11_FINAL_DEFAULT_WORKSPACE_CLEANED=PASS')
              print('NO_SHA_PATH_HOST_OR_PAYLOAD_PRINTED=PASS')
          except BaseException as exc:
              print('PHASE11_FINAL_DEFAULT_EVIDENCE_FAILED', type(exc).__name__)
              sys.exit(1)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Phase 11 normal-app evidence audit failed' }
