name: AKUZ Phase 11 process overlap 23+24+25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase11-process-overlap-multi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Balanced process overlap on 23+24+25 Sep
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 70
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact three-source benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run serial process process serial on 23+24+25
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          $privateRoot = 'E:\Software\Project\LogAkusExplorer\akuzlogparser'
          $diagnostics = Join-Path $privateRoot 'diagnostics'
          python -B scripts/bench_phase11_process_overlap_multi.py `
            --config (Join-Path $privateRoot 'ConnectConf.cfg') `
            --app-root $privateRoot `
            --diagnostics $diagnostics `
            --result (Join-Path $diagnostics 'phase11_process_overlap_23_24_25_20260928.json')
          if ($LASTEXITCODE -ne 0) { throw 'Phase 11 three-source process benchmark failed' }
          Write-Host 'PHASE11_SCOPE=THREE_SOURCE_LARGE_EXPERIMENT_NOT_PRODUCTION'
          Write-Host 'ONE_CHILD_MAX=PASS'
          Write-Host 'COMPRESSION_FORCED_OFF=PASS'
          Write-Host 'NO_RELEASE_CHANGE=PASS'
