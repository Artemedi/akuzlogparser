name: AKUZ Phase 11 replicated SSH overlap 23+24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase11-ssh-overlap-replicated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replicated:
    name: Balanced serial-overlap replication on 23+24 Sep
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact replicated benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run balanced serial overlap overlap serial trials
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          $privateRoot = 'E:\Software\Project\LogAkusExplorer\akuzlogparser'
          $diagnostics = Join-Path $privateRoot 'diagnostics'
          python -B scripts/bench_phase11_ssh_overlap_replicated.py `
            --config (Join-Path $privateRoot 'ConnectConf.cfg') `
            --app-root $privateRoot `
            --diagnostics $diagnostics `
            --result (Join-Path $diagnostics 'phase11_ssh_overlap_23_24_replicated_20260928.json')
          if ($LASTEXITCODE -ne 0) { throw 'Phase 11 replicated pair benchmark failed' }
          Write-Host 'PHASE11_SCOPE=BALANCED_2X2_PAIR_REPLICATION_NOT_PRODUCTION_GATE'
          Write-Host 'COMPRESSION_FORCED_OFF=PASS'
          Write-Host 'NO_RELEASE_CHANGE=PASS'
