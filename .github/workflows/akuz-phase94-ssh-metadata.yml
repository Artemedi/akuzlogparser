name: AKUZ Phase 9.4 SSH metadata identity probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase94-ssh-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Read-only SSH metadata identity on DBA-008D
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact probe code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare two read-only SSH listings without fetching logs
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          @'
          from pathlib import Path
          import sys
          
          def main():
              import akuz_fetch
              root = Path(r'E:\Software\Project\LogAkusExplorer\akuzlogparser')
              cfg = akuz_fetch.load_config(root / 'ConnectConf.cfg', root)
              first = akuz_fetch.list_remote(cfg, notify=lambda message: None)
              second = akuz_fetch.list_remote(cfg, notify=lambda message: None)
              days = ('20260923','20260924','20260925')
              def rows(items):
                  out = {}
                  for day in days:
                      match = [row for row in items if row['name'] == day + '_server.log']
                      if len(match) != 1:
                          raise AssertionError('expected frozen day missing or ambiguous')
                      out[day] = match[0]
                  return out
              a, b = rows(first), rows(second)
              for day in days:
                  left, right = a[day], b[day]
                  if left.get('device') is None or left.get('inode') is None:
                      raise AssertionError('server identity fields unavailable')
                  if right.get('device') is None or right.get('inode') is None:
                      raise AssertionError('server identity fields unavailable on repeat')
                  for key in ('id','path','size','mtime_raw','device','inode'):
                      if left.get(key) != right.get(key):
                          raise AssertionError('remote metadata changed across repeated listing')
                  if not left['path'].startswith(cfg.remote_log_dir.rstrip('/') + '/'):
                      raise AssertionError('path escaped configured root')
                  print('REMOTE_METADATA_DAY_PASS day=%s bytes=%d stable_id=1 device_inode=1'
                        % (day, left['size']))
              print('REMOTE_METADATA_PROBE_COUNT', len(days))
              print('REMOTE_METADATA_REPEAT_STABLE=PASS')
              print('REMOTE_DEVICE_INODE_AVAILABLE=PASS')
              print('REMOTE_PATH_ROOT_BOUND=PASS')
              print('NO_LOG_PAYLOAD_FETCHED=PASS')
              print('NO_HOST_PATH_INODE_OR_DIGEST_PRINTED=PASS')
          
          try:
              main()
          except BaseException as exc:
              print('REMOTE_METADATA_PROBE_FAILED', type(exc).__name__)
              sys.exit(1)
          
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'SSH metadata identity probe failed' }
