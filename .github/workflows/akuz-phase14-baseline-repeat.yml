name: AKUZ Phase 14 baseline repeat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase14-baseline-repeat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akuz-phase14-baseline-repeat
  cancel-in-progress: true

jobs:
  repeat:
    name: Repeated stdlib same-snapshot baseline
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact revision
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) {
            throw 'Checkout does not match GITHUB_SHA'
          }
          Write-Host "EXACT_SHA=$actual"

      - name: Run repeated cached-snapshot stdlib baseline
        run: |
          $ErrorActionPreference = 'Stop'
          $privateRoot = 'E:\Software\Project\LogAkusExplorer\akuzlogparser'
          & python -B scripts/diag_phase14_baseline_repeat.py `
            --config (Join-Path $privateRoot 'ConnectConf.cfg') `
            --app-root $privateRoot
          if ($LASTEXITCODE -ne 0) { throw 'Phase 14 repeated baseline failed' }
          Write-Host 'REAL_REPORTS=23_24_25_SEP'
          Write-Host 'NETWORK_FETCH_DURING_REPEAT=NO'
          Write-Host 'RAW_LOG_ARTIFACT_UPLOAD=NO'
          Write-Host 'APP_CACHE_CHANGED=NO'
          Write-Host 'RELEASE_CHANGED=NO'

      - name: Diff hygiene
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          Write-Host 'DIFF_CHECK=PASS'
