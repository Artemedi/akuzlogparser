name: AKUZ Phase 11 overlap smoke evidence audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase11-overlap-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only Phase 11 numeric evidence on DBA-008D
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Audit private smoke JSON without source identifiers
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          @'
          import json
          from pathlib import Path
          import sys

          path = Path(r'E:\Software\Project\LogAkusExplorer\akuzlogparser\diagnostics\phase11_ssh_overlap_23_24_smoke_20260928.json')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
              if data['status'] != 'PHASE11_REAL_PAIR_SMOKE_NOT_ACCEPTANCE':
                  raise AssertionError('unexpected status')
              if data['days'] != ['20260923','20260924']:
                  raise AssertionError('unexpected days')
              if data.get('compression') is not False:
                  raise AssertionError('compression not isolated')
              if not data.get('source_sha_equal') or not data.get('report_manifest_equal'):
                  raise AssertionError('parity failed')
              if not data.get('workspace_cleaned') or data.get('raw_payload_saved'):
                  raise AssertionError('cleanup/privacy failed')
              if data.get('app_cache_changed') or data.get('release_changed'):
                  raise AssertionError('scope boundary failed')
              for mode in ('serial','overlap'):
                  row=data[mode]
                  if row['fetched'] != 2 or row['parsed'] != 2:
                      raise AssertionError('unexpected operation count')
                  if row['memory_samples'] < 10 or row['unreadable_memory_samples'] != 0:
                      raise AssertionError('memory evidence invalid')
                  print('PHASE11_MODE',mode,
                        f"wall_s={row['wall_s']:.6f}",
                        f"cpu_s={row['process_cpu_s']:.6f}",
                        f"peak_ws={row['sampled_peak_ws_bytes']}",
                        f"peak_private={row['sampled_peak_private_bytes']}",
                        f"workspace_bytes={row['workspace_bytes']}",
                        f"memory_samples={row['memory_samples']}")
                  for day in ('20260923','20260924'):
                      p=row['parse'][day]
                      print('PHASE11_STAGE',mode,day,
                            f"fetch_s={row['fetch'][day]:.6f}",
                            f"parse_wall_s={p['wall_s']:.6f}",
                            f"parse_cpu_s={p['process_cpu_s']:.6f}",
                            f"events={p['events']}",
                            f"physical_lines={p['physical_lines']}",
                            f"report_bytes={p['report_bytes']}")
              print('PHASE11_SOURCE_SHA_EQUAL=PASS')
              print('PHASE11_REPORT_MANIFEST_EQUAL=PASS')
              print('PHASE11_WORKSPACE_CLEANED=PASS')
              print('NO_SHA_PATH_HOST_OR_PAYLOAD_PRINTED=PASS')
          except BaseException as exc:
              print('PHASE11_EVIDENCE_AUDIT_FAILED', type(exc).__name__)
              sys.exit(1)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Phase 11 evidence audit failed' }
