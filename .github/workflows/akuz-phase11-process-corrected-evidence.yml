name: AKUZ Phase 11 corrected process evidence audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akuz-phase11-process-corrected-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit corrected Phase 11 process evidence on DBA-008D
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Audit corrected private numeric JSON
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DBA-008D' -or $env:COMPUTERNAME -ne 'DBA-008D') {
            throw 'DBA-008D only'
          }
          @'
          import json
          from pathlib import Path
          import statistics
          import sys

          path = Path(r'E:\Software\Project\LogAkusExplorer\akuzlogparser\diagnostics\phase11_process_overlap_23_24_corrected_20260928.json')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
              if data['status'] != 'PHASE11_PROCESS_ISOLATION_PAIR_EXPERIMENT_NOT_PRODUCTION':
                  raise AssertionError('unexpected status')
              if data['order'] != ['serial','process','process','serial']:
                  raise AssertionError('unexpected order')
              if data['days'] != ['20260923','20260924']:
                  raise AssertionError('unexpected days')
              if data.get('fixed_prefix_bytes') != {
                      '20260923': 171378567, '20260924': 140361291}:
                  raise AssertionError('unexpected fixed prefixes')
              if data.get('compression') is not False:
                  raise AssertionError('compression not isolated')
              if not data.get('source_sha_equal') or not data.get('report_manifest_equal'):
                  raise AssertionError('parity failed')
              if not data.get('workspace_cleaned') or data.get('raw_payload_saved'):
                  raise AssertionError('cleanup/privacy failed')
              if data.get('app_cache_changed') or data.get('release_changed'):
                  raise AssertionError('scope failed')
              trials = data['trials']
              if len(trials) != 4:
                  raise AssertionError('trial count')
              for row, mode in zip(trials, data['order']):
                  if row['mode'] != mode or row['fetched'] != 2 or row['parsed'] != 2:
                      raise AssertionError('operation contract failed')
                  if row['memory_samples'] < 10 or row['unreadable_memory_samples'] != 0:
                      raise AssertionError('memory evidence invalid')
                  if mode == 'process':
                      if row.get('max_sampled_processes', 0) < 2:
                          raise AssertionError('child not represented in tree memory')
                      if row.get('child_cpu_s', 0) <= 0 or row.get('parent_cpu_s', 0) <= 0:
                          raise AssertionError('process CPU split invalid')
                      if row.get('fetch', {}).get('20260924', 0) <= 0:
                          raise AssertionError('child fetch wall missing')
                      if row.get('fetch_ready_latency', {}).get('20260924', 0) <= 0:
                          raise AssertionError('ready latency missing')
                      if row['fetch_ready_latency']['20260924'] < row['fetch']['20260924']:
                          raise AssertionError('ready latency cannot precede child fetch wall')
              for mode in ('serial','process'):
                  rows=[x for x in trials if x['mode']==mode]
                  walls=[x['wall_s'] for x in rows]
                  cpu=[x['process_cpu_s'] for x in rows]
                  private=[x['sampled_peak_private_bytes'] for x in rows]
                  fetch=[x['fetch']['20260924'] for x in rows]
                  parse=[x['parse']['20260923']['wall_s'] for x in rows]
                  print('PHASE11_CORRECTED',mode,
                        'wall_s=' + ','.join(f'{v:.6f}' for v in walls),
                        f'wall_median={statistics.median(walls):.6f}',
                        f'cpu_median={statistics.median(cpu):.6f}',
                        f'private_median={int(statistics.median(private))}',
                        'second_fetch_s=' + ','.join(f'{v:.6f}' for v in fetch),
                        'first_parse_s=' + ','.join(f'{v:.6f}' for v in parse))
              prow=[x for x in trials if x['mode']=='process']
              ready=[x['fetch_ready_latency']['20260924'] for x in prow]
              pure=[x['fetch']['20260924'] for x in prow]
              print('PHASE11_CORRECTED_PROCESS_READY_S',
                    ','.join(f'{v:.6f}' for v in ready))
              print('PHASE11_CORRECTED_PROCESS_FETCH_S',
                    ','.join(f'{v:.6f}' for v in pure))
              print('PHASE11_CORRECTED_SOURCE_SHA_EQUAL=PASS')
              print('PHASE11_CORRECTED_REPORT_MANIFEST_EQUAL=PASS')
              print('PHASE11_CORRECTED_WORKSPACE_CLEANED=PASS')
              print('NO_SHA_PATH_HOST_OR_PAYLOAD_PRINTED=PASS')
          except BaseException as exc:
              print('PHASE11_CORRECTED_EVIDENCE_FAILED', type(exc).__name__)
              sys.exit(1)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Corrected Phase 11 evidence audit failed' }
